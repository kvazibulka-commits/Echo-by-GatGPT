name: Build Echo APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check server
        run: |
          python -m py_compile server/echo_server.py
          python -m unittest discover -s tests -v
      - name: Accept SDK licenses and install compile SDK 37
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses > sdk-licenses.log 2>&1
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
          sdkmanager "platforms;android-37" "build-tools;36.0.0" 2>&1 | tee sdk-install.log
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee gradle-build.log
      - name: Report failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.log'):
              text = path.read_text(errors='replace')[-6000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={path.name}::{text}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: echo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
